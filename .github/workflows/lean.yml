name: Lean proofs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    name: Build, axiom audit, and kernel replay
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Lean, restore Mathlib cache, and build
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true

      - name: Check manuscript theorem statements
        run: lake env lean verification/ManuscriptStatements.lean

      - name: Enforce the axiom allowlist in all four audits
        run: python3 -B code/check_axioms.py

      - name: Replay the full proof library in the kernel
        # Each concurrent check loads Mathlib; bound memory on hosted runners.
        env:
          LEAN_NUM_THREADS: "1"
        run: lake env leanchecker --verbose OddCycle

      - name: Check generated Lean certificate against its source data
        run: python3 -B code/export_lean_certificate.py --check
